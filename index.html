<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GATE DA Study</title>
<style>
  :root {
    --bg: #f4f6f7;
    --panel: #ffffff;
    --ink: #1b2430;
    --muted: #5d6b7a;
    --line: #dde3e8;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --accent-soft: #e0f2ef;
    --done: #8a97a5;
  }
  :root[data-theme="dark"] {
    --bg: #14181d;
    --panel: #1b2128;
    --ink: #e7ecf1;
    --muted: #93a1b0;
    --line: #2b343e;
    --accent: #4fd1c0;
    --accent-ink: #0c1a18;
    --accent-soft: #1c2f2d;
    --done: #6c7886;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 2rem 1rem 4rem;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* header */
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.75rem; }
  h1 { font: 600 2rem/1.2 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.95rem; margin-top: 0.25rem; }
  .theme-btn {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 0.45rem 0.8rem; font-size: 0.9rem; cursor: pointer; white-space: nowrap;
  }
  .theme-btn:hover { border-color: var(--accent); }

  /* continue block */
  .next {
    background: var(--accent-soft); border: 1px solid var(--accent);
    border-radius: 12px; padding: 1.25rem 1.4rem; margin-bottom: 1.75rem;
  }
  .next p { color: var(--muted); font-size: 0.9rem; }
  .next h2 { font: 600 1.6rem/1.3 Georgia, serif; margin: 0.15rem 0 0.9rem; }
  .next .row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .progress { flex: 1; min-width: 160px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
  .progress small { color: var(--muted); font-size: 0.82rem; display: block; margin-top: 0.35rem; }

  .open {
    background: var(--accent); color: var(--accent-ink); text-decoration: none;
    padding: 0.55rem 1.1rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; white-space: nowrap;
  }
  .open:hover { filter: brightness(1.08); }
  .open.quiet { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 0.35rem 0.8rem; font-weight: 500; font-size: 0.88rem; }
  .open.quiet:hover { border-color: var(--accent); filter: none; }

  /* toolbar */
  .tools { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
  .search {
    width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 0.7rem 1rem; font-size: 1rem;
  }
  .search::placeholder { color: var(--muted); }
  .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .tab {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 99px; padding: 0.35rem 0.95rem; font-size: 0.9rem; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* list */
  section { margin-bottom: 2rem; }
  h3 { font: 600 1.15rem/1.3 Georgia, serif; margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: baseline; }
  h3 small { font: 400 0.85rem system-ui, sans-serif; color: var(--muted); }
  ul { list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 0.9rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex: none; }
  .name { flex: 1; min-width: 0; }
  .name b { font-weight: 600; display: block; overflow-wrap: anywhere; }
  .name span { color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
  li.done .name b { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }

  .msg { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 2rem 1.25rem; text-align: center; color: var(--muted); }
  .msg.err { border-color: #c2410c; }

  .new { font-style: normal; font-size: 0.72rem; font-weight: 600; background: var(--accent); color: var(--accent-ink); padding: 0.1rem 0.5rem; border-radius: 99px; margin-left: 0.4rem; vertical-align: middle; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.82rem; text-align: center; }

  @media (max-width: 520px) {
    body { padding-top: 1.25rem; }
    h1 { font-size: 1.6rem; }
    .next h2 { font-size: 1.4rem; }
    .open.quiet { padding: 0.35rem 0.65rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>GATE DA Study</h1>
      <p class="sub">Daily PDFs from your GitHub repository</p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">Dark mode</button>
  </header>

  <div id="next"></div>

  <div class="tools">
    <input class="search" id="search" type="search" placeholder="Search by day or name" aria-label="Search files">
    <div class="tabs" id="tabs">
      <button class="tab" data-f="all" aria-pressed="true">All</button>
      <button class="tab" data-f="main" aria-pressed="false">Main study</button>
      <button class="tab" data-f="py" aria-pressed="false">Python and DSA</button>
      <button class="tab" data-f="test" aria-pressed="false">Tests</button>
    </div>
  </div>

  <div id="list"><div class="msg">Loading files from GitHub...</div></div>

  <footer><span id="status">Checking for new PDFs...</span> <button class="link" id="refreshBtn" type="button">Check now</button></footer>
</div>

<script>
(function () {
  const OWNER = 'mohdshamii', REPO = 'GateDA', BRANCH = 'main';
  const API = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
  const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;

  const SECTIONS = [
    { key: 'main', title: 'Main study' },
    { key: 'py',   title: 'Python and DSA' },
    { key: 'test', title: 'Tests' },
    { key: 'other', title: 'Other' }
  ];

  let files = [], filter = 'all', query = '', done = {};

  const $ = id => document.getElementById(id);
  const listEl = $('list'), nextEl = $('next');

  /* ---------- safe storage ---------- */
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- theme ---------- */
  const root = document.documentElement;
  const themeBtn = $('themeBtn');
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
    store.set('theme', t);
  }
  setTheme(store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBtn.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

  /* ---------- progress memory ---------- */
  try { done = JSON.parse(store.get('done') || '{}'); } catch (e) { done = {}; }

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  function category(name) {
    if (/^\d+_day\.pdf$/i.test(name)) return 'main';
    if (/python|dsa/i.test(name)) return 'py';
    if (/weekly|major|mock|test/i.test(name)) return 'test';
    return 'other';
  }

  function title(name) {
    const m = name.match(/^(\d+)_day/i);
    if (m) return 'Day ' + m[1];
    return name.replace(/\.pdf$/i, '').replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2')
      .split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }

  const url = f => f.download_url || `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodeURIComponent(f.name)}`;
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true });

  /* ---------- render ---------- */
  function renderNext() {
    const main = files.filter(f => category(f.name) === 'main').sort(byName);
    if (!main.length) { nextEl.innerHTML = ''; return; }
    const finished = main.filter(f => done[f.name]).length;
    const next = main.find(f => !done[f.name]);
    const pct = Math.round(finished / main.length * 100);
    nextEl.innerHTML = `
      <div class="next">
        <p>${next ? 'Continue with' : 'All main study days finished'}</p>
        <h2>${next ? esc(title(next.name)) : 'Well done'}</h2>
        <div class="row">
          <div class="progress">
            <div class="bar"><span style="width:${pct}%"></span></div>
            <small>${finished} of ${main.length} main days done</small>
          </div>
          ${next ? `<a class="open" data-n="${esc(next.name)}" href="${esc(url(next))}" target="_blank" rel="noopener">Open PDF</a>` : ''}
        </div>
      </div>`;
  }

  function row(f) {
    return `
      <li class="${done[f.name] ? 'done' : ''}">
        <input type="checkbox" data-n="${esc(f.name)}" ${done[f.name] ? 'checked' : ''} aria-label="Mark ${esc(title(f.name))} as done">
        <div class="name"><b>${esc(title(f.name))}${isNew(f) ? '<em class="new">New</em>' : ''}</b><span>${esc(f.path)}</span></div>
        <a class="open quiet" data-n="${esc(f.name)}" href="${esc(url(f))}" target="_blank" rel="noopener">Open</a>
      </li>`;
  }

  function render() {
    renderNext();
    const q = query.trim().toLowerCase();
    const shown = files.filter(f =>
      (filter === 'all' || category(f.name) === filter) &&
      (!q || f.name.toLowerCase().includes(q) || title(f.name).toLowerCase().includes(q))
    );

    if (!files.length) {
      listEl.innerHTML = '<div class="msg">No PDFs found in the repository root. Add a PDF to the main branch and refresh.</div>';
      return;
    }
    if (!shown.length) {
      listEl.innerHTML = '<div class="msg">Nothing matches. Clear the search or pick another tab.</div>';
      return;
    }

    listEl.innerHTML = SECTIONS.map(s => {
      const items = shown.filter(f => category(f.name) === s.key).sort(byName);
      if (!items.length) return '';
      const d = items.filter(f => done[f.name]).length;
      return `<section><h3>${s.title}<small>${d} of ${items.length} done</small></h3><ul>${items.map(row).join('')}</ul></section>`;
    }).join('');
  }

  /* ---------- events ---------- */
  listEl.addEventListener('change', e => {
    const n = e.target.dataset && e.target.dataset.n;
    if (!n) return;
    if (e.target.checked) done[n] = 1; else delete done[n];
    store.set('done', JSON.stringify(done));
    render();
  });

  $('search').addEventListener('input', e => { query = e.target.value; render(); });

  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', t === b));
    render();
  });

  /* ---------- new-file tracking ---------- */
  let seen = null;
  try { seen = JSON.parse(store.get('seen') || 'null'); } catch (e) {}
  const isNew = f => !!seen && !seen[f.name];
  function markSeen(n) {
    if (seen && !seen[n]) { seen[n] = 1; store.set('seen', JSON.stringify(seen)); }
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-n]');
    if (a) { markSeen(a.dataset.n); setTimeout(render, 0); }
  });

  /* ---------- load (always fresh from GitHub) ---------- */
  const statusEl = $('status');
  const fromTree = tree => tree
    .filter(i => i.type === 'blob' && /\.pdf$/i.test(i.path))
    .map(i => ({
      name: i.path.split('/').pop(),
      path: i.path,
      download_url: RAW + i.path.split('/').map(encodeURIComponent).join('/')
    }));

  async function load() {
    statusEl.textContent = 'Checking for new PDFs...';
    try {
      const r = await fetch(API, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 403 ? 'GitHub rate limit reached, try again in a few minutes' : 'GitHub returned status ' + r.status);
      const data = await r.json();
      files = fromTree(data.tree || []);
      store.set('cache', JSON.stringify(files));
      if (!seen) { seen = {}; files.forEach(f => seen[f.name] = 1); store.set('seen', JSON.stringify(seen)); }
      render();
      statusEl.textContent = 'Up to date. Last checked ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '.';
    } catch (err) {
      if (files.length) {
        statusEl.textContent = err.message + '. Showing the last saved list.';
      } else {
        listEl.innerHTML = `<div class="msg err">Could not load files. ${esc(err.message)}. Check your connection, then press Check now.</div>`;
        statusEl.textContent = '';
      }
    }
  }

  // show the saved list instantly, then fetch the latest
  try {
    const cached = JSON.parse(store.get('cache') || 'null');
    if (Array.isArray(cached) && cached.length) { files = cached; render(); }
  } catch (e) {}

  load();
  $('refreshBtn').addEventListener('click', load);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
